name: CI

on:
  push:
    branches: [main, fix/*, feat/*]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Server)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: .
      - name: Install API dependencies
        run: npm ci
        working-directory: api
      - name: Lint
        run: npx eslint --ext .js . --max-warnings 50
        working-directory: .
      - name: Test
        run: npm test
        working-directory: api

  pro:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            pro/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: .
      - name: Install Frontend dependencies
        run: npm ci
        working-directory: pro
      - name: Lint
        run: npx eslint --ext .js,.jsx . --max-warnings 50
        working-directory: .
      - name: Test
        run: npx vitest run
        working-directory: pro
