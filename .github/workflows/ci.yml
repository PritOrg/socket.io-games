name: CI

on:
  push:
    branches: [main, fix/*, feat/*]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: .
      - name: Install API dependencies
        run: npm ci
        working-directory: api
      - name: Lint
        run: npx eslint --ext .js . --max-warnings 50
        working-directory: .
      - name: Test
        run: npm test
        working-directory: api

  pro:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            pro/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: .
      - name: Install Frontend dependencies
        run: npm ci
        working-directory: pro
      - name: Lint
        run: npx eslint --ext .js,.jsx . --max-warnings 50
        working-directory: .
      - name: Test
        run: npx vitest run
        working-directory: pro

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            pro/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: pro

      - name: Install E2E dependencies
        run: npm install
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  load:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install Load Test dependencies
        run: npm install
        working-directory: load

      - name: Start API server
        run: |
          node index.js &
          echo "Waiting for server..."
          for i in $(seq 1 10); do
            curl -s http://localhost:4000/health > /dev/null && echo "Server ready" && break
            sleep 1
          done
        working-directory: api

      - name: Run load test
        run: node runner.js --connections 10 --duration 15
        working-directory: load
        env:
          LOAD_SERVER_URL: http://localhost:4000

      - name: Stop API server
        run: kill $(lsof -t -i:4000) 2>/dev/null || true

      - name: Upload load report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: load/*.log
          retention-days: 7
