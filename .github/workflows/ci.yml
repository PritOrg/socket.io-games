name: CI

on:
  push:
    branches: [main, fix/*, feat/*]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - run: npm ci
        working-directory: ..
      - run: npm ci
        working-directory: api
      - run: npx eslint --ext .js . --max-warnings 50
        working-directory: ..
      - run: npm test

  pro:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            pro/package-lock.json

      - run: npm ci
        working-directory: ..
      - run: npm ci
        working-directory: pro
      - run: npx eslint --ext .js,.jsx . --max-warnings 50
        working-directory: ..
      - run: npx vitest run
